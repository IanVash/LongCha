<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Long Cha | Menu QR y pedidos</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="home">
    <header class="public-header">
      <div class="shell public-header__inner">
        <a class="brand-lockup" href="/">
          <img src="/assets/brand/longcha-mark.png" alt="Logo Long Cha">
          <div>
            <strong data-business-name>Long Cha</strong>
            <span>Te del dragon</span>
          </div>
        </a>
        <nav class="nav-actions">
          <a class="btn btn--ghost" href="/status">Estado de pedido</a>
          <a class="btn btn--brand" href="/menu">Ver menu</a>
        </nav>
      </div>
    </header>

    <main class="shell hero">
      <section>
        <h1 data-business-heading>Long Cha</h1>
        <p>Bubble tea artesanal inspirado en Taiwan, con pedidos en linea y seguimiento claro desde el celular.</p>
        <div class="nav-actions" style="justify-content:flex-start;margin-top:24px">
          <a class="btn btn--brand" href="/menu">Ordenar ahora</a>
          <a class="btn btn--ghost" href="/status">Seguir pedido</a>
        </div>
      </section>
      <section class="hero-media" aria-label="Productos destacados">
        <div class="hero-ticket">
          <div><strong>Taro Milk Tea</strong><span>$4.25</span></div>
          <div><strong>Brown Sugar Boba</strong><span>$4.75</span></div>
          <div><strong>Dragon Combo</strong><span>$9.25</span></div>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
