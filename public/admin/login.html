<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Panel interno</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="admin-login">
    <main class="login-page">
      <section class="login-card">
        <div class="brand-lockup">
          <img src="/api/public/art/logo.svg" alt="Logo">
          <div>
            <strong>Panel interno</strong>
            <span>Pedidos, cocina y administracion</span>
          </div>
        </div>
        <form id="loginForm" class="form-grid" style="grid-template-columns:1fr;margin-top:22px">
          <label>Email<input class="field" name="email" type="email" value="admin@demo.com" required></label>
          <label>Password<input class="field" name="password" type="password" value="Admin123!" required></label>
          <button class="btn btn--brand" type="submit">Entrar</button>
          <p class="muted">Demo: admin@demo.com / Admin123!</p>
        </form>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
